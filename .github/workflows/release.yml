name: Release AssuanLibrary

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable 2.x.x version to prepare (next release is 2.0.1)
        required: true
        type: string
      resume_sha:
        description: Existing prepared release branch SHA to resume after inspection
        required: false
        type: string
        default: ''

concurrency:
  group: assuan-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
  DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home

jobs:
  prepare:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prepared_sha: ${{ steps.candidate.outputs.prepared_sha || steps.resume.outputs.prepared_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.resume_sha != '' && format('release/v{0}', inputs.version) || 'develop' }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reject a moved branch or an existing NuGet version
        shell: pwsh
        env:
          EVENT_SHA: ${{ github.sha }}
          RESUME_SHA: ${{ inputs.resume_sha }}
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '\A2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -or
              $env:EVENT_SHA -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Expected a stable 2.x.x candidate and a valid source SHA.'
          }
          $selected = if ($env:RESUME_SHA) { $env:RESUME_SHA } else { $env:EVENT_SHA }
          $checked = & pwsh -NoProfile -NonInteractive -File ./scripts/ci/Assert-CheckoutSha.ps1 -Sha $selected -Repository $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Checkout differs from the selected commit.' }
          if ($env:RESUME_SHA) {
            $candidate = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Assert-ResumeCandidate.ps1 -Root $env:GITHUB_WORKSPACE -Version $env:RELEASE_VERSION -ResumeSha $env:RESUME_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Explicit release candidate cannot be resumed.' }
          }
          $uri = "https://api.nuget.org/v3-flatcontainer/assuanlibrary/$($env:RELEASE_VERSION)/assuanlibrary.$($env:RELEASE_VERSION).nupkg"
          $result = Invoke-WebRequest -Uri $uri -Method Head -SkipHttpErrorCheck
          if ($result.StatusCode -ne 404) { throw 'NuGet version exists or its absence cannot be confirmed.' }
      - name: Preview and prepare exactly one release commit
        if: inputs.resume_sha == ''
        id: candidate
        shell: pwsh
        env:
          EVENT_SHA: ${{ github.sha }}
          ASSUAN_RELEASE_PREPARE: '1'
        run: |
          $preview = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Prepare-Version.ps1 -Root $env:GITHUB_WORKSPACE -Version $env:RELEASE_VERSION -ExpectedSha $env:EVENT_SHA -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'Release preview failed.' }
          $prepared = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Prepare-Version.ps1 -Root $env:GITHUB_WORKSPACE -Version $env:RELEASE_VERSION -ExpectedSha $env:EVENT_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
          git switch -c "release/v$($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Release branch could not be created.' }
          git add -- CHANGELOG.md README.md wiki/Getting-Started.md src/AssuanLibrary/PACKAGE.md src/AssuanLibrary/AssuanLibrary.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Release edits could not be staged.' }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 1) { throw 'Release preparation produced no staged changes.' }
          git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(release): prepare for $($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation commit failed.' }
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Prepared SHA is invalid.' }
          git push origin "HEAD:refs/heads/release/v$($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Release branch push failed; inspect before retry.' }
          $remote = git ls-remote origin "refs/heads/release/v$($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0 -or $remote -cnotmatch ('\A' + $sha + '\s+refs/heads/release/v' +
              [regex]::Escape($env:RELEASE_VERSION) + '\z')) {
            throw 'Remote release branch does not match the prepared commit.'
          }
          "prepared_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Reuse only the exact inspected release candidate
        if: inputs.resume_sha != ''
        id: resume
        shell: pwsh
        env:
          RESUME_SHA: ${{ inputs.resume_sha }}
        run: |
          $candidate = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Assert-ResumeCandidate.ps1 -Root $env:GITHUB_WORKSPACE -Version $env:RELEASE_VERSION -ResumeSha $env:RESUME_SHA
          if ($LASTEXITCODE -ne 0 -or $candidate.Trim() -cne $env:RESUME_SHA) {
            throw 'Release branch changed while resuming.'
          }
          "prepared_sha=$env:RESUME_SHA" >> $env:GITHUB_OUTPUT

  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.prepared_sha }}

  interop:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/interop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.prepared_sha }}

  build:
    needs: [prepare, ci, interop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          persist-credentials: false
      - name: Require both gates to identify this checkout
        shell: pwsh
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
          CI_SHA: ${{ needs.ci.outputs.source_sha }}
          INTEROP_SHA: ${{ needs.interop.outputs.source_sha }}
        run: |
          $checked = & pwsh -NoProfile -NonInteractive -File ./scripts/ci/Assert-CheckoutSha.ps1 -Sha $env:PREPARED_SHA -Repository $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Artifact checkout differs from prepared SHA.' }
          $outputs = @{ ci = $env:CI_SHA; interop = $env:INTEROP_SHA } | ConvertTo-Json -Compress
          $gates = & pwsh -NoProfile -NonInteractive -File ./scripts/ci/Assert-Gate.ps1 -Sha $env:PREPARED_SHA -RequiredJobsJson '["ci","interop"]' -ResultsJson '{"ci":"success","interop":"success"}' -UpstreamShasJson $outputs
          if ($LASTEXITCODE -ne 0) { throw 'Release gates validated different commits.' }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore AssuanLibrary.slnx --locked-mode
      - run: dotnet build AssuanLibrary.slnx -c Release --no-restore
      - name: Pack the only NuGet package
        run: dotnet pack src/AssuanLibrary/AssuanLibrary.csproj -c Release --no-build --no-restore "-p:PackageVersion=${RELEASE_VERSION}" -o artifacts/release-candidate
      - name: Bind and verify the original artifacts
        shell: pwsh
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
          CI_SHA: ${{ needs.ci.outputs.source_sha }}
          INTEROP_SHA: ${{ needs.interop.outputs.source_sha }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $candidate = Join-Path $root 'artifacts/release-candidate'
          $package = Join-Path $candidate "AssuanLibrary.$($env:RELEASE_VERSION).nupkg"
          $built = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Build-ReleaseArtifacts.ps1 -Root $root -Version $env:RELEASE_VERSION -PreparedSha $env:PREPARED_SHA -PackagePath $package -OutputDirectory $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Artifact assembly failed.' }
          $verified = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Verify-Release.ps1 -Root $root -Version $env:RELEASE_VERSION -PreparedSha $env:PREPARED_SHA -CiSha $env:CI_SHA -InteropSha $env:INTEROP_SHA -PackagePath $package -ManifestPath (Join-Path $candidate 'release-artifacts.json')
          if ($LASTEXITCODE -ne 0) { throw 'Artifact verification failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-v${{ inputs.version }}-${{ needs.prepare.outputs.prepared_sha }}
          path: |
            artifacts/release-candidate/AssuanLibrary.${{ inputs.version }}.nupkg
            artifacts/release-candidate/release-artifacts.json
          if-no-files-found: error

  # Signs a provenance statement for the exact verified bytes. This job can request an OIDC token but
  # has no release environment, no repository write access and no registry credential.
  attest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-v${{ inputs.version }}-${{ needs.prepare.outputs.prepared_sha }}
          path: artifacts/release-download
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release-download/AssuanLibrary.${{ inputs.version }}.nupkg

  promote:
    needs: [prepare, ci, interop, build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Recheck branch, main ancestry and tag before atomic promotion
        shell: pwsh
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
        run: |
          $checked = & pwsh -NoProfile -NonInteractive -File ./scripts/ci/Assert-CheckoutSha.ps1 -Sha $env:PREPARED_SHA -Repository $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Promotion checkout differs from prepared SHA.' }
          $remote = git ls-remote origin refs/heads/main "refs/heads/release/v$($env:RELEASE_VERSION)" "refs/tags/v$($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Release refs could not be inspected.' }
          $refs = @{}
          foreach ($line in $remote) { $parts = $line -split '\s+', 2; $refs[$parts[1]] = $parts[0] }
          if ($refs["refs/heads/release/v$($env:RELEASE_VERSION)"] -cne $env:PREPARED_SHA -or
              $refs.ContainsKey("refs/tags/v$($env:RELEASE_VERSION)") -or -not $refs['refs/heads/main'] -or
              $refs['refs/heads/main'] -ceq $env:PREPARED_SHA) {
            throw 'Release branch, main or tag changed before promotion.'
          }
          git merge-base --is-ancestor $refs['refs/heads/main'] $env:PREPARED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Main cannot advance to the prepared commit.' }
          git tag "v$($env:RELEASE_VERSION)" $env:PREPARED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release tag could not be prepared.' }
          git push --atomic origin "$($env:PREPARED_SHA):refs/heads/main" "refs/tags/v$($env:RELEASE_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Atomic promotion failed; inspect refs before retry.' }

  publish:
    needs: [prepare, ci, interop, build, promote]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-v${{ inputs.version }}-${{ needs.prepare.outputs.prepared_sha }}
          path: artifacts/release-download
      - name: Verify downloaded bytes and all gate SHAs before publication
        shell: pwsh
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
          CI_SHA: ${{ needs.ci.outputs.source_sha }}
          INTEROP_SHA: ${{ needs.interop.outputs.source_sha }}
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USERNAME)) { throw 'NuGet trusted-publishing owner is not configured.' }
          $package = "artifacts/release-download/AssuanLibrary.$($env:RELEASE_VERSION).nupkg"
          $verified = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Verify-Release.ps1 -Root $env:GITHUB_WORKSPACE -Version $env:RELEASE_VERSION -PreparedSha $env:PREPARED_SHA -CiSha $env:CI_SHA -InteropSha $env:INTEROP_SHA -PackagePath $package -ManifestPath artifacts/release-download/release-artifacts.json
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded artifact verification failed.' }
      - name: Obtain a short-lived NuGet key by OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish the already verified package exactly once
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NuGet OIDC credential was not issued.' }
          dotnet nuget push "artifacts/release-download/AssuanLibrary.$($env:RELEASE_VERSION).nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet upload outcome requires manual registry inspection; do not retry automatically.' }

  # Everything after the accepted upload lives in its own job. nuget.org validates and indexes a
  # version for an unpredictable time, so this job may be re-run alone without uploading again.
  confirm:
    needs: [prepare, ci, interop, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-v${{ inputs.version }}-${{ needs.prepare.outputs.prepared_sha }}
          path: artifacts/release-download
      - name: Verify the original artifacts again before comparing the registry
        shell: pwsh
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
          CI_SHA: ${{ needs.ci.outputs.source_sha }}
          INTEROP_SHA: ${{ needs.interop.outputs.source_sha }}
        run: |
          $package = "artifacts/release-download/AssuanLibrary.$($env:RELEASE_VERSION).nupkg"
          $verified = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Verify-Release.ps1 -Root $env:GITHUB_WORKSPACE -Version $env:RELEASE_VERSION -PreparedSha $env:PREPARED_SHA -CiSha $env:CI_SHA -InteropSha $env:INTEROP_SHA -PackagePath $package -ManifestPath artifacts/release-download/release-artifacts.json
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded artifact verification failed.' }
      - name: Wait for registry visibility and confirm the published identity
        shell: pwsh
        run: |
          $registryPackage = "artifacts/registry/AssuanLibrary.$($env:RELEASE_VERSION).nupkg"
          $waited = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Wait-RegistryPackage.ps1 -Version $env:RELEASE_VERSION -OutFile $registryPackage -TimeoutMinutes 45
          if ($LASTEXITCODE -eq 2) { throw 'NuGet has not exposed the version yet; re-run only this failed job. Do not upload again.' }
          if ($LASTEXITCODE -ne 0) { throw 'NuGet registry response requires manual inspection.' }
          $compared = & pwsh -NoProfile -NonInteractive -File ./scripts/release/Compare-RegistryPackage.ps1 -OriginalPath "artifacts/release-download/AssuanLibrary.$($env:RELEASE_VERSION).nupkg" -Version $env:RELEASE_VERSION -RegistryPath $registryPackage
          if ($LASTEXITCODE -ne 0) { throw 'Published package differs from the validated artifact.' }
      - name: Create the GitHub Release with the original package attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$($env:RELEASE_VERSION)"
          $asset = "AssuanLibrary.$($env:RELEASE_VERSION).nupkg"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            # A previous attempt of this job already created the release: accept only the identical asset.
            $existing = 'artifacts/release-existing'
            [IO.Directory]::CreateDirectory($existing) | Out-Null
            $listed = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0 -or $listed.Count -ne 1 -or $listed[0] -cne $asset) {
              throw 'An existing GitHub Release has different assets; inspect before continuing.'
            }
            gh release download $tag --dir $existing
            if ($LASTEXITCODE -ne 0) { throw 'The existing GitHub Release asset could not be compared.' }
            $original = (Get-FileHash -LiteralPath "artifacts/release-download/$asset" -Algorithm SHA256).Hash
            $published = (Get-FileHash -LiteralPath (Join-Path $existing $asset) -Algorithm SHA256).Hash
            if ($original -cne $published) { throw 'The existing GitHub Release asset differs from the original.' }
          }
          else {
            gh release create $tag "artifacts/release-download/$asset" --verify-tag --title "AssuanLibrary $($env:RELEASE_VERSION)" --notes "See the changelog for AssuanLibrary $($env:RELEASE_VERSION). The attached package is the one published to nuget.org."
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation requires manual inspection.' }
          }

  sync:
    needs: [prepare, confirm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          persist-credentials: true
      - name: Advance develop only when it remains a fast-forward
        shell: pwsh
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.prepared_sha }}
        run: |
          $checked = & pwsh -NoProfile -NonInteractive -File ./scripts/ci/Assert-CheckoutSha.ps1 -Sha $env:PREPARED_SHA -Repository $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Develop synchronization checkout differs from prepared SHA.' }
          git push origin "$($env:PREPARED_SHA):refs/heads/develop"
          if ($LASTEXITCODE -ne 0) { throw 'Develop changed; published release remains intact for human integration.' }
