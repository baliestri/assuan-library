name: Release Package to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (e.g., v1.2.3)"
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create package
        run: |
          dotnet pack -c Release -o ./nupkg

      - name: NuGet Authenticate
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Publish package to NuGet
        run: |
          for nupkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://www.nuget.org/api/v2/package
          done
