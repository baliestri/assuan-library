name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AssuanLibrary.slnx

      - name: Build
        run: dotnet build AssuanLibrary.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/AssuanLibrary.Tests/AssuanLibrary.Tests.csproj -c Release --no-build
