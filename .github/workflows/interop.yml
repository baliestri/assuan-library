name: GnuPG interoperability

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact lowercase commit SHA to validate
        required: true
        type: string
    outputs:
      source_sha:
        description: Commit validated against real GnuPG on every platform
        value: ${{ jobs.gate.outputs.source_sha }}
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache
  DOTNET_CLI_HOME: ${{ github.workspace }}/artifacts/dotnet-home

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - name: Validate the requested commit before checkout
        id: select
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALL_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          $sha = if ($env:EVENT_NAME -eq 'workflow_call') { $env:CALL_SHA } else { $env:EVENT_SHA }
          if ($sha -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Invalid source SHA.' }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.select.outputs.source_sha }}
          persist-credentials: false
      - name: Confirm event selection and checkout
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALL_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.select.outputs.source_sha }}
        run: |
          $selected = & ./scripts/ci/Resolve-SourceSha.ps1 -EventName $env:EVENT_NAME -SourceSha $env:CALL_SHA -EventSha $env:EVENT_SHA
          if ($selected -cne $env:SOURCE_SHA) { throw 'Selected SHA changed.' }
          & ./scripts/ci/Assert-CheckoutSha.ps1 -Sha $env:SOURCE_SHA -Repository $env:GITHUB_WORKSPACE

  real:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ASSUAN_GNUPG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Confirm checkout
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: ./scripts/ci/Assert-CheckoutSha.ps1 -Sha $env:SOURCE_SHA -Repository $env:GITHUB_WORKSPACE
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Provision one GnuPG installation and record its version
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:RUNNER_OS) {
            'Linux' {
              sudo apt-get update -qq
              if ($LASTEXITCODE -ne 0) { throw 'GnuPG package index failed.' }
              sudo apt-get install -y gnupg
              if ($LASTEXITCODE -ne 0) { throw 'GnuPG provisioning failed.' }
              $bin = '/usr/bin'
            }
            'macOS' {
              brew install gnupg
              if ($LASTEXITCODE -ne 0) { throw 'GnuPG provisioning failed.' }
              $prefix = & brew --prefix gnupg
              if ($LASTEXITCODE -ne 0) { throw 'GnuPG installation prefix is unavailable.' }
              $bin = Join-Path $prefix.Trim() 'bin'
            }
            'Windows' {
              Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
              $scoopRoot = Join-Path $env:RUNNER_TEMP 'assuan-scoop'
              $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
              Invoke-WebRequest -Uri 'https://get.scoop.sh' -OutFile $installer
              & $installer -RunAsAdmin -ScoopDir $scoopRoot
              if ($LASTEXITCODE -ne 0) { throw 'Scoop installation failed.' }
              $scoop = Join-Path $scoopRoot 'shims\scoop.ps1'
              & $scoop install main/gnupg
              if ($LASTEXITCODE -ne 0) { throw 'GnuPG provisioning failed.' }
              $bin = Join-Path $scoopRoot 'apps\gnupg\current\bin'
            }
            default { throw 'Unsupported runner OS.' }
          }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $tools = @{}
          foreach ($name in @('gpgconf', 'gpg-agent', 'gpg-connect-agent')) {
            $path = Join-Path $bin "$name$suffix"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw 'A required GnuPG executable is unavailable.'
            }
            $tools[$name] = $path
          }
          $versionLines = & $tools['gpgconf'] --version
          $banner = $versionLines | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or $banner -notmatch '\b([0-9]+\.[0-9]+\.[0-9]+)\b') {
            throw 'GnuPG version is unavailable.'
          }
          $version = [Version]$Matches[1]
          if ($version.Major -lt 2 -or ($version.Major -eq 2 -and $version.Minor -lt 2)) {
            throw 'GnuPG version is unsupported.'
          }
          Write-Output "GnuPG version $version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ASSUAN_GPGCONF_PATH=$($tools['gpgconf'])" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ASSUAN_GPG_AGENT_PATH=$($tools['gpg-agent'])" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ASSUAN_GPG_CONNECT_AGENT_PATH=$($tools['gpg-connect-agent'])" -Encoding utf8
      - run: dotnet restore AssuanLibrary.slnx --locked-mode
      - run: dotnet build AssuanLibrary.slnx -c Release --no-restore
      - name: Require real agent and independent peer interoperability
        run: dotnet test --project tests/AssuanLibrary.Tests/AssuanLibrary.Tests.csproj -c Release --no-restore -- --filter-namespace AssuanLibrary.Tests.Interop

  gate:
    if: always()
    needs: [prepare, real]
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
    steps:
      - name: Reject an absent or invalid selected commit
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Required source SHA is unavailable.' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Validate every required result against the checked-out SHA
        id: check
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          & ./scripts/ci/Assert-CheckoutSha.ps1 -Sha $env:SOURCE_SHA -Repository $env:GITHUB_WORKSPACE
          $needs = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
          $required = @('prepare', 'real')
          $results = @{}
          foreach ($job in $required) { $results[$job] = $needs[$job].result }
          & ./scripts/ci/Assert-Gate.ps1 -Sha $env:SOURCE_SHA -RequiredJobsJson (ConvertTo-Json -InputObject $required -Compress) -ResultsJson (ConvertTo-Json -InputObject $results -Compress) -OutputFile $env:GITHUB_OUTPUT
